name: agent

# 观察端（Tauri）独立工作流：单独装 webview 系统依赖并编译校验，
# 不并进 ci.yml —— 免得把重量级 GUI 依赖拖进已全绿的 client/server 流水线。
on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
      # 观察端直接读客户端的读路径与契约（/api/lesson/<id>、blob、adapters 返回体）。
      # 这些变了必须重跑构建校验 —— 否则 UI 会对着一个已经变形的接口静默失效，
      # 而 ci.yml 里的接口测试不会发现，因为它不编译 agent。
      - "client/src/serve.rs"
      # timeline 决定导出里有没有 sources[id].screen / close_extra；适配器的 main.rs
      # 决定调参表单上那些键名适配器认不认。两者都是 UI 的隐式契约。
      - "client/src/timeline.rs"
      - "client/adapters/**"
      - "shared/**"
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
      - "client/src/serve.rs"
      - "client/src/timeline.rs"
      - "client/adapters/**"
      - "shared/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Tauri 在 Linux 需要 webview / GTK 系统库；Windows 的 WebView2 SDK 由 runner 自带。
      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: agent-${{ matrix.os }}

      - name: build
        run: cargo build --manifest-path agent/src-tauri/Cargo.toml --message-format=short

      # 零构建的静态 UI 跑不了断言，而"静默失效"恰好是它最大的风险：后端改了键名、
      # 表单加了个后端不认的框、id 打错一个字母——三者都不会让构建变红。
      # 这一步用秒级文本断言钉住；界面本身只能在真机上验（见 agent/README.md）。
      - name: ui guards (text only)
        shell: bash
        # Windows runner 上 Python 的 stdout 默认按本地代码页（cp1252）编码，
        # 这些断言文案是中文 —— 不设这行会在 print 处直接 UnicodeEncodeError（与工装有关，不是守卫断的事）。
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python3 - <<'PY'
          import re, sys
          app = open('agent/ui/app.js', encoding='utf-8').read()
          html = open('agent/ui/index.html', encoding='utf-8').read()
          rust = open('client/adapters/a-audio/src/vad.rs', encoding='utf-8').read() \
               + open('client/adapters/a-audio/src/main.rs', encoding='utf-8').read()
          scr = open('client/adapters/a-screen/src/main.rs', encoding='utf-8').read()
          caps = open('client/adapters/a-screen/src/capture.rs', encoding='utf-8').read()
          fails = []
          def need(c, m):
              if not c:
                  fails.append(m)

          # 1) 二进制一律走 webview 原生媒体元素。http_get 只回文本（from_utf8_lossy），
          #    WAV 与 PNG 字节经过它一次就不是原来那份了——这条是回听与看图共同的分水岭。
          need('<audio id="player"' in html, 'index.html 里没有 <audio id="player"> 元素，回听链路断了')
          need('<img id="frameView"' in html, 'index.html 里没有 <img id="frameView"> 元素，关键帧看原图的链路断了')
          need('/blob/' in app, 'app.js 不再直连 blob 读路径：观察端听不到也看不到')
          for i, line in enumerate(app.splitlines(), 1):
              need(not ('/blob/' in line and ('http_get' in line or 'await get(' in line or 'post(' in line)),
                   f'app.js:{i} 把 blob 交给了文本型命令，二进制会被毁：{line.strip()}')

          # 2a) 录音调参：UI 里出现的参数名必须是适配器真认识的键。名字错了不报错，只是静默无效。
          names = set(re.findall(
              r'"(rms_open|rms_close|hangover_ms|preroll_ms|min_speech_ms|max_segment_ms|frame_ms|sample_rate|emit_silence)"', app))
          need(len(names) == 9, f'录音调参表单该覆盖 9 个参数，实得 {sorted(names)}')
          known = set(re.findall(r'get\("([a-z_]+)"\)', rust))
          need(names <= known, f'UI 里这些参数名后端不认：{sorted(names - known)}（后端={sorted(known)}）')

          # 2b) 抓屏调参：唯一出处是 Cfg::from_params 的函数体——它是"适配器读哪些键"的定义。
          #     不拿全文件扫：别处一句注释里的字符串就能让一个错字溜过去。
          snames = set(re.findall(
              r'"(poll_ms|min_interval_ms|min_dist|min_mad|max_width|max_frames_per_lesson|max_bytes_per_lesson|emit_dirty|capture|monitor)"',
              app))
          need(len(snames) == 10, f'抓屏调参表单该覆盖 10 个参数，实得 {sorted(snames)}')
          m = re.search(r'fn from_params\(.*?\n    \}', scr, re.S)
          need(m, 'a-screen 的 Cfg::from_params 找不到了：这条守卫失去唯一出处')
          if m:
              sknown = set(re.findall(r'(?:get|num)\("([a-z_]+)"', m.group(0)))
              need(snames <= sknown, f'UI 里这些抓屏参数适配器不认：{sorted(snames - sknown)}（适配器={sorted(sknown)}）')

          # 2c) capture 下拉框的取值就是 capture.rs 的 BACKENDS；对不上 = 能写进去但起不来
          bm = re.search(r'pub const BACKENDS: \[[^\]]*\]\s*=\s*\[([^\]]*)\]', caps)
          need(bm, 'capture.rs 里的 BACKENDS 清单没找到——它是这条链的唯一出处')
          if bm:
              be = sorted(re.findall(r'"([a-z0-9]+)"', bm.group(1)))
              need(be == ['auto', 'dxgi', 'gdi', 'x11'], f'BACKENDS 应当是 auto/dxgi/gdi/x11，实得 {be}')
              need(re.search(r'\[\s*"auto",\s*"gdi",\s*"dxgi",\s*"x11"\s*\]', app),
                   'app.js 的下拉框选项与 BACKENDS 不再一致：改适配器清单要同时改界面')

          # 3) 引用的每个 #id 都得存在（typo 型静默失败：拿到 null 才发现）
          ids = set()
          for line in app.splitlines():
              if ' + ' in line or '`' in line:
                  continue          # 动态拼出来的选择器（#tab-<名字>）不在静态可断范围
              ids |= set(re.findall(r'\$\("#([A-Za-z][A-Za-z0-9_-]*)"\)', line))
          have = set(re.findall(r'id="([^"]+)"', html))
          need(ids and not (ids - have), f'app.js 引用了 index.html 里不存在的 id：{sorted(ids - have)}')

          # 4) 每个标签按钮都得有对应的 section，否则点上去就是一片空白
          for tab in set(re.findall(r'data-tab="([^"]+)"', html)):
              need(f'id="tab-{tab}"' in html, f'标签“{tab}”没有对应的 section#tab-{tab}')

          # 5) “下一节课生效”是这个接口的真实语义，写错了就是骗教师
          need('下一节课' in app and '下一节课' in html,
               'UI 不再声明“下一节课生效”：要么文案改了，要么这条语义丢了——两者都得红')

          if fails:
              print('UI GUARD FAIL')
              for f in fails:
                  print('  -', f)
              sys.exit(1)
          print('UI GUARD OK  两条二进制直连 blob / 9 + 10 个参数名对齐 / 后端清单 / id 与标签页都在')
          PY

      - name: test
        run: cargo test --manifest-path agent/src-tauri/Cargo.toml --message-format=short

      # 产物必须能被取回：本机没有 cargo，也不在本地装 GUI 依赖（省磁盘）。
      # 没有这一步，观察端就只能「编译通过」而永远没人真正点开过它。
      - name: artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.os }}
          path: |
            agent/src-tauri/target/debug/agent
            agent/src-tauri/target/debug/agent.exe
          if-no-files-found: error
