name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # a-audio 用 cpal 取麦克风：Linux 侧的 ALSA 绑定在编译期需要系统头文件；
      # Windows 侧走纯 Rust 的 windows 绑定，runner 自带，不需要额外安装。
      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # 整个 workspace 之前只靠 agent.yml 对 agent/ 做格式检查，client/server 这侧从没查过：
      # 手改代码不会坏构建，但会一路漂。
      #
      # 首次上闸实测：每个 .rs 都有 diff（~170 处，含本次没碰过的 server/src/main.rs、
      # shared/src/lib.rs、a-fake），所以先只报警不拦路。等一次单独的 `chore: cargo fmt`
      # 重排提交合进去，就删掉那行 `continue-on-error` 让它真开始拦。千万别把重排混进功能提交里。
      - name: fmt --check
        continue-on-error: true
        run: cargo fmt --all --check

      - name: build
        run: cargo build --workspace --all-targets --message-format=short

      - name: test
        run: cargo test --workspace --message-format=short

      # 端到端守卫，两个平台各跑一遍同一份脚本：Windows 侧的子进程 spawn、管道、
      # CRLF、$TARGET_DIR 补 .exe 这些行为只有真 Windows runner 能证。
      - name: smoke (client + adapters)
        shell: bash
        run: bash tools/ci-smoke.sh

      # 客户端 → 远程服务端的 HTTP 链路：真实 push、落盘去重、AI 请求单、鉴权、路径穿越。
      - name: integration (client -> server)
        shell: bash
        run: bash tools/ci-integration.sh

      # 录音适配器：用 fixture 回放断真分段/真 blob/真导出，再断"本机没麦克风必须被标 silent"。
      - name: audio (a-audio)
        shell: bash
        run: bash tools/ci-audio.sh

      # 关键帧适配器：用 Python 手搓的 PNG 回放断变化检测/节流/真 blob，再断"静止的一节课只有一帧"。
      - name: screen (a-screen)
        shell: bash
        run: bash tools/ci-screen.sh

      - name: strip linker junk
        shell: bash
        run: rm -f target/debug/*.d

      - name: artifact
        uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.os }}
          path: |
            target/debug/classagent-client*
            target/debug/classagent-server*
            target/debug/a-fake*
            target/debug/a-audiofile*
            target/debug/a-audio*
            target/debug/a-screen*
          if-no-files-found: warn

  # 只跑构建不跑测试：脚本守卫在 build job 里已经跑过了，这里要的是另一个 profile。
  # 发出去的产物一直是 debug，release 下的常量折叠/饱和算术/panic=abort 这类差异从没被编译过；
  # 而「debug 过 release 红」的代码（依赖整数溢出、忘记取余的索引）到打包那天才爆就太晚了。
  release:
    name: release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-release

      - name: build --release
        run: cargo build --release --workspace --all-targets --message-format=short
