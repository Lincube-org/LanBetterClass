# ClassAgent —— 三端同仓，物理目录即模块边界：
#   client/  采集客户端（classagent-client；含 client/adapters 数据源子进程）
#   server/  远程服务端（classagent-server）
#   agent/   观察端（Tauri，独立 workspace，见 .github/workflows/agent.yml）
#   shared/  三端共享契约（crate 名仍为 classagent-schema，保持稳定 import）
[workspace]
resolver = "2"
members = [
    "shared",
    "client",
    "server",
    "client/adapters/a-fake",
    "client/adapters/a-audiofile",
    "client/adapters/a-audio",
    "client/adapters/a-screen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
classagent-schema = { path = "shared" }
# 只用它起本地看板服务。选 tiny_http 而不是 axum/hyper：不引入 async 运行时，
# 依赖树小得多，而这台机器的磁盘和内存都是约束。
tiny_http = "0.12"
# 只有 a-audio 用得到它：跨平台取麦克风。不放 reqwest/portaudio 一类，
# 是因为这个依赖只该长在一个适配器子进程里，客户端与服务端的树保持不动。
cpal = "0.18"
# 只有 a-screen 用得到这几个，同理不长进主树：
# png 是纯 Rust 编解码（关键帧 blob 要能被 <img src> 直接显示，第三方写来的 PNG 也要能读）；
# windows 只负责 GDI / DXGI 抓屏绑定，x11rb 只负责 Linux 的 X11 抓屏，
# 两者都按 target 段编译（见 a-screen/Cargo.toml），不会互相拖进对方的依赖树。
png = "0.18"
# 只有 a-screen 的 Linux 后端用得到：纯 Rust X11 协议实现，不链 libxcb，
# 所以 CI 不需要额外的系统库（X11 服务本身由 Xvfb 提供）。
# composite 用于"有合成器时抓 overlay 窗口"，否则根窗口只有背景。
x11rb = { version = "0.13", features = ["composite"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_UI_WindowsAndMessaging",
] }

# 这台机器的磁盘是约束条件之一：debug=0 省掉 Windows 上体积最大的 PDB。
[profile.dev]
debug = 0
incremental = true

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
