[package]
name = "a-screen"
description = "屏幕关键帧适配器：GDI / DXGI / X11 抓屏 → dHash 变化检测 → PNG blob，产出 screen.keyframe"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "a-screen"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
classagent-schema.workspace = true
# 纯 Rust 编解码：写出的 blob 要能被观察端 <img src> 直接显示，
# 读进来的第三方 PNG（课件导出的图、fixture 回放）也要能解。
png.workspace = true

# 抓屏绑定按平台进编译树：Windows 用 windows crate，Linux 用纯 Rust 的 x11rb。
# 两者互不拖累；Wayland / PipeWire 仍未实现，运行时明确拒绝而不是假装采到黑屏。
[target.'cfg(windows)'.dependencies]
windows.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
