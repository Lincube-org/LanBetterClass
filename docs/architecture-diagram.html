    <text class="s" x="44" y="792">输入侧模块化 = 独立子进程适配器，插拔不改客户端；契约单一来源 shared/（crate 名 classagent-schema），客户端与服务端共用同一份类型与 kind 约定。</text>
    <text class="s" x="44" y="812">录音与屏幕两条都已接通：a-audio 按话轮切段，a-screen 只在画面真变了时落一张 PNG（两道门限是“或”：dHash 看不见整块变亮，均差看不见同位格换内容）；两者的尾帧与 session.close 都落在同一节课里。</text>
    <text class="s" x="44" y="830" fill="#b9c3d6">但两条都只验了半：CI 跑的是 fixture 回放（顺带在 Windows runner 上用 gdi 真采到了一帧 1080p：Up 过滤后 ≈ 0.7 MB（同一帧 NoFilter 时 ≈ 2.3 MB）；Linux runner 起 Xvfb 用 x11 真采 1280×720 并看见两次底色变化，纯色帧 15–19 KB）；真麦克风与真桌面（尤其 DXGI 在高刷 / HDR / 锁屏下，以及多屏与 DPI）从未在目标一体机上跑过；Linux 的 Wayland / PipeWire 仍未实现，X11 在真实桌面上也未验。音频也未做重采样与压缩（48k 单声道约 5.8 MB/分钟）。还差的：④ 下游真正接模型（请求单已可回放），以及 a-whiteboard。链没做完整之前，「AI 结论」不该对外宣称。</text>
